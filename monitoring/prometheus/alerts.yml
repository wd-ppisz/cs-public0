# Scrape with node_exporter's textfile collector.
# Define expectations in your own recording rules, one series per selected target:
# - record: cs_public0_expected
#   expr: vector(1)
#   labels: {job: node, instance: 'hypervisor.example.invalid:9100', bridge: public0, queue: '100'}
groups:
  - name: cs-public0
    interval: 15s
    rules:
      - alert: CsPublic0TelemetryMissing
        expr: cs_public0_expected == 1 unless on(job, instance, bridge, queue) cs_public0_telemetry_known
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Bridge inspection telemetry is missing on {{ $labels.instance }}'
          description: 'The expected sensor has no telemetry series. Check scrape health, the textfile path and the monitor timer.'
      - alert: CsPublic0TelemetryUnknown
        expr: cs_public0_telemetry_known == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'Bridge inspection state is unknown on {{ $labels.instance }}'
          description: 'At least one required sensor, queue, selector or counter observation is unavailable.'
      - alert: CsPublic0TelemetryStale
        expr: time() - cs_public0_last_publish_unix_seconds > 60
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'Bridge inspection telemetry is stale on {{ $labels.instance }}'
          description: 'The last successful textfile publication is older than one minute.'
      - alert: CsPublic0InspectionDegraded
        expr: cs_public0_degraded_latched == 1
        for: 0s
        labels: {severity: warning}
        annotations:
          summary: 'Bridge inspection degradation latched on {{ $labels.instance }}'
          description: 'Inspect queue drops, engine exceptions, resource pressure and restart history before acknowledging the latch.'
      - alert: CsPublic0NfqNetlinkLoss
        expr: increase(cs_public0_queue_netlink_dropped[10m]) > 0
        for: 0s
        labels: {severity: warning}
        annotations:
          summary: 'New NFQUEUE socket message loss on {{ $labels.instance }}'
          description: 'Preserve the loss history. Socket Drops are not attack or lost-request counts. Check effective receive capacity, worker scheduling and traffic bursts.'
      - alert: CsPublic0InspectionAccountingGap
        expr: cs_public0_accounting_unexplained_gap > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Unresolved inspection accounting gap on {{ $labels.instance }}'
          description: 'This is uncertainty between observation stages, not an exact count of requests accepted without inspection. Correlate queue/socket evidence without clearing history.'
  # Optional GSO expectations have host/profile labels. Define them for every
  # intended sensor in your own recording rules, independently of core labels.
  # cs_public0_gso_expected{host="host-a",profile="public0-ipv4-alert"} 1
  # cs_public0_expected_rcvbuf_bytes{host="host-a",profile="public0-ipv4-alert"} 33554432
  - name: cs-public0-gso
    interval: 15s
    rules:
      - alert: CsPublic0GsoNotConfirmed
        expr: >-
          (cs_public0_gso_expected == 1) unless on(host,profile)
          ((cs_public0_gso_known == 1) and on(host,profile) (cs_public0_gso_enabled == 1)
          and on(host,profile) ((cs_public0_gso_last_publish_unix_seconds <= time())
          and on(host,profile) (time() - cs_public0_gso_last_publish_unix_seconds <= 45)))
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'GSO is not freshly confirmed on {{ $labels.host }}'
          description: 'Verify the pinned engine, explicit setting, queue owner and current-invocation acknowledgement. Do not change NIC offloads automatically.'
      - alert: CsPublic0ReceiveBufferNotConfirmed
        expr: >-
          (cs_public0_expected_rcvbuf_bytes > 0) unless on(host,profile)
          ((cs_public0_nfq_rcvbuf_known == 1) and on(host,profile)
          (cs_public0_nfq_rcvbuf_effective_bytes == on(host,profile) cs_public0_expected_rcvbuf_bytes)
          and on(host,profile) ((cs_public0_gso_last_publish_unix_seconds <= time())
          and on(host,profile) (time() - cs_public0_gso_last_publish_unix_seconds <= 45)))
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'Required NFQUEUE receive buffer is not verified on {{ $labels.host }}'
          description: 'Verify current socket identity, effective SO_RCVBUF and engine acknowledgement. A configured number alone is insufficient.'
