<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
<title id="title">cs-public0 traffic path</title>
<desc id="desc">IPv4 traffic is forwarded in both directions through a Linux bridge. The forward hook queues packets in kernel NFQUEUE. Suricata receives a packet copy and returns a verdict; the kernel resumes forwarding. A health monitor exports Prometheus metrics and Suricata writes EVE logs. IPv6 and host input/output are outside this scope.</desc>
<rect width="1400" height="880" fill="#ffffff"/>
<text x="48" y="66.56" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#172c46">cs-public0</text>
<text x="48" y="107.82" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#53647a">IPv4 inspection on a Linux bridge</text>
<text x="48" y="156.44" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#315e9e">TRAFFIC PATH  /  BOTH DIRECTIONS</text>
<rect x="48" y="184" width="245" height="108" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="170.5" y="246.16" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#172c46">Bridge uplink</text>
<rect x="465" y="184" width="470" height="108" rx="14" fill="#edf4ff" stroke="#9cb7dd" stroke-width="2"/>
<text x="700" y="230.18" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#172c46">Linux bridge</text>
<text x="700" y="268.48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#53647a">forward hook</text>
<rect x="1107" y="184" width="245" height="108" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1229.5" y="229.82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#172c46">Virtual router</text>
<text x="1229.5" y="267.14" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#53647a">or guest TAP</text>
<line x1="304" y1="238" x2="454" y2="238" stroke="#315e9e" stroke-width="3"/>
<polygon points="454,238 441,232 441,244" fill="#315e9e"/>
<polygon points="304,238 317,244 317,232" fill="#315e9e"/>
