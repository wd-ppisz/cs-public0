<polygon points="334,656 347,662 347,650" fill="#087f82"/>
<text x="394" y="635.12" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#087f82">Status</text>
<text x="48" y="753.12" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#53647a">Reads Suricata, NFQUEUE,</text>
<text x="48" y="780.12" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#53647a">nftables and systemd</text>
<rect x="1077" y="600" width="275" height="112" rx="14" fill="#f0f9f8" stroke="#a8d5cf" stroke-width="2"/>
