<text x="48" y="849.8" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#53647a">Scope: forwarded IPv4 on the configured bridge. IPv6 and host input/output are excluded.</text>
