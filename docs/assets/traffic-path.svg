<polygon points="1096,238 1083,232 1083,244" fill="#315e9e"/>
<polygon points="946,238 959,244 959,232" fill="#315e9e"/>
<rect x="465" y="392" width="470" height="96" rx="14" fill="#edf4ff" stroke="#9cb7dd" stroke-width="2"/>
<text x="700" y="436.18" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#172c46">NFQUEUE</text>
<text x="700" y="469.8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#53647a">Kernel keeps the queued packet</text>
<line x1="585" y1="303" x2="585" y2="381" stroke="#315e9e" stroke-width="3"/>
<polygon points="585,381 591,368 579,368" fill="#315e9e"/>
