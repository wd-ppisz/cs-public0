name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Root-only observer refresh transaction tests
        run: sudo python3 -B -m unittest discover -s tests -p test_observer_refresh.py -v
      - name: Ansible syntax
        working-directory: ansible
        run: |
          ansible-playbook -i ../examples/apache-cloudstack-kvm/inventory.ini site.yml --syntax-check
          ansible-playbook -i ../examples/apache-cloudstack-kvm/inventory.ini rule-controller.yml --syntax-check
          ansible-playbook -i ../examples/apache-cloudstack-kvm/inventory.ini scan.yml --syntax-check
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt
  flow:
    # Builds the read-only flow probe object and exercises TCX attach, record
    # and detach on a disposable veth/namespace pair of the runner kernel.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev iproute2
          sudo apt-get install -y --no-install-recommends "linux-tools-$(uname -r)" || sudo apt-get install -y --no-install-recommends linux-tools-azure linux-tools-common
          clang --version | head -1
          bpftool version
          uname -r
      - name: Build flow_probe.o
        run: |
          mkdir -p flow-out
          clang -O2 -g -Wall -Werror -target bpf -D__TARGET_ARCH_x86 \
            -I/usr/include/x86_64-linux-gnu -c bpf/flow_probe.c -o flow-out/flow_probe.o
          llvm-objdump -h flow-out/flow_probe.o | grep -E ' (tc|\.maps|license)'
          (cd flow-out && sha256sum flow_probe.o > flow_probe.o.sha256 && cat flow_probe.o.sha256)
          printf '{"source_commit":"%s","clang":"%s","kernel":"%s"}\n' "$GITHUB_SHA" \
            "$(clang --version | head -1)" "$(uname -r)" > flow-out/build.json
      - name: Flow probe namespace smoke
        run: |
          set +e
          sudo FLOW_OBJECT="$PWD/flow-out/flow_probe.o" python3 -B tests/integration/flow.py
          result=$?
          if [ "$result" -eq 77 ]; then
            echo '::error::Flow probe prerequisites unavailable; smoke was not validated.'
            exit 1
          fi
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flow-probe-object
          path: flow-out/
          retention-days: 30
  dataplane:
    # This VM has its own kernel; namespaces do not alter its root firewall.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test and build dependencies
        timeout-minutes: 8
        run: |
          # Ten sam podpisany zbiór Ubuntu; mirror niezależny od DNS Canonical.
          test -f /etc/apt/apt-mirrors.txt
          test -f /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends build-essential autoconf automake libtool pkg-config rustc cargo python3 libpcap-dev libpcre2-dev libyaml-dev zlib1g-dev libnet1-dev libjansson-dev libcap-ng-dev libmagic-dev libnetfilter-queue-dev libnfnetlink-dev libnss3-dev liblz4-dev libhyperscan-dev nftables iproute2 curl
      - name: Build pinned stock Suricata for dataplane tests
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_BUILD_JOBS: "2"
        run: |
          # Archiwum i pin są wspólne z tools/build_nfq_engine.py; bez opcjonalnych patchy.
          # Budowa nie zależy od API/PPA Launchpada i nie pomija testów dataplane.
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 120 --max-filesize 67108864 -o "$RUNNER_TEMP/suricata.tar.gz" https://www.openinfosecfoundation.org/download/suricata-8.0.7.tar.gz
          echo "a9d46a9c8f40e81f8a6df3ecc2c5a9a8e8da985876299108d92da547c013ba8c  $RUNNER_TEMP/suricata.tar.gz" | sha256sum --check -
          python3 - "$RUNNER_TEMP/suricata.tar.gz" "$RUNNER_TEMP/suricata-source" <<'PY'
          import sys
          from pathlib import Path
          from tools.build_nfq_engine import extract_source
          destination = Path(sys.argv[2])
          destination.mkdir()
          extract_source(Path(sys.argv[1]), destination)
          PY
          cd "$RUNNER_TEMP/suricata-source/suricata-8.0.7"
          rustc --version
          ./configure --enable-nfqueue --enable-gccprotect --enable-pie --disable-unittests --disable-gccmarch-native --disable-python --prefix=/usr --sysconfdir=/etc --localstatedir=/var
          make -j2
          sudo make install
          # Jak w pakiecie i tools/build_nfq_engine.py: bez symboli debugowania.
          stat --format='%n %s bytes before strip' /usr/bin/suricata
          sudo strip --strip-unneeded /usr/bin/suricata
          stat --format='%n %s bytes after strip' /usr/bin/suricata
          sudo make install-conf
          sudo ldconfig
          suricata --build-info
          uname -r
      - name: Namespace smoke
        run: |
          set +e
          sudo python3 tests/integration/netns.py
          result=$?
          if [ "$result" -eq 77 ]; then
            echo '::error::Dataplane prerequisites unavailable; smoke was not validated.'
            exit 1
          fi
          exit "$result"
      - name: Scan detector table in an empty network namespace
        run: |
          set +e
          sudo unshare --net python3 -B tests/integration/scan.py
          result=$?
          if [ "$result" -eq 77 ]; then
            echo '::error::Scan detector prerequisites unavailable; table smoke was not validated.'
            exit 1
          fi
          exit "$result"
      - name: Four-file activation and process-death recovery
        run: |
          set +e
          sudo --preserve-env=GITHUB_ACTIONS python3 tests/integration/activation.py
          result=$?
          if [ "$result" -eq 77 ]; then
            echo '::error::Activation prerequisites unavailable; qualification was not validated.'
            exit 1
          fi
          exit "$result"
