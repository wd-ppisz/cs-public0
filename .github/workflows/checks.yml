name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Ansible syntax
        working-directory: ansible
        run: |
          ansible-playbook -i ../examples/apache-cloudstack-kvm/inventory.ini site.yml --syntax-check
          ansible-playbook -i ../examples/apache-cloudstack-kvm/inventory.ini rule-controller.yml --syntax-check
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt
  dataplane:
    # This VM has its own kernel; namespaces do not alter its root firewall.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test dependencies
        run: |
          sudo add-apt-repository -y ppa:oisf/suricata-stable
          sudo apt-get update
          sudo apt-get install -y suricata nftables iproute2 curl
          sudo systemctl disable --now suricata.service
          suricata --build-info
          uname -r
      - name: Namespace smoke
        run: |
          set +e
          sudo python3 tests/integration/netns.py
          result=$?
          if [ "$result" -eq 77 ]; then
            echo '::error::Dataplane prerequisites unavailable; smoke was not validated.'
            exit 1
          fi
          exit "$result"
      - name: Four-file activation and process-death recovery
        run: |
          set +e
          sudo --preserve-env=GITHUB_ACTIONS python3 tests/integration/activation.py
          result=$?
          if [ "$result" -eq 77 ]; then
            echo '::error::Activation prerequisites unavailable; qualification was not validated.'
            exit 1
          fi
          exit "$result"
